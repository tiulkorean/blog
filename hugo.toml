# ─────────────────────────────────────────────
#  사이트 기본 설정
#  배포 주소가 정해지면 baseURL 만 바꾸면 됩니다.
# ─────────────────────────────────────────────
baseURL = "https://example.com/"
title = "Tiul Korean"
defaultContentLanguage = "en"
locale = "en-US"
timeZone = "Asia/Seoul"

# 본문은 영어 위주라 단어 수 기준 읽기 시간 계산
hasCJKLanguage = false
summaryLength = 40

enableRobotsTXT = true

[pagination]
  pagerSize = 10

# 레슨 주소: /lessons/<slug>/ , 목록: /lessons/
# (content/posts 폴더 이름은 그대로 두고 주소만 바꿈)
[permalinks]
  [permalinks.page]
    posts = "/lessons/:slug/"
  [permalinks.section]
    posts = "/lessons/"

[taxonomies]
  level = "levels"          # beginner / intermediate / advanced
  category = "categories"   # Drama Phrases / Slang / Honorifics / Culture ...
  drama = "dramas"          # 표현이 나오는 드라마 제목 (선택)
  tag = "tags"

[params]
  description = "Learn the Korean you hear in K-dramas — one expression at a time, with example lines and quick quizzes."
  author = "Tiul Korean"
  showSource = true
  homePosts = 10
  # 난이도 표시 순서·이름 (key 는 front matter 의 levels 값)
  [params.levelLabels]
    beginner = "Beginner"
    intermediate = "Intermediate"
    advanced = "Advanced"

[menus]
  [[menus.main]]
    name = "Lessons"
    pageRef = "/posts"
    weight = 10
  [[menus.main]]
    name = "Levels"
    pageRef = "/levels"
    weight = 20
  [[menus.main]]
    name = "Topics"
    pageRef = "/categories"
    weight = 30
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 40

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style = "github"
    noClasses = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]

[sitemap]
  changeFreq = "daily"
  priority = 0.5
