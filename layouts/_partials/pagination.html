{{ if gt .TotalPages 1 }}
<nav class="pager" aria-label="Pagination">
  {{ with .Prev }}<a href="{{ .URL }}">← Newer</a>{{ else }}<span></span>{{ end }}
  <span class="muted">{{ .PageNumber }} / {{ .TotalPages }}</span>
  {{ with .Next }}<a href="{{ .URL }}">Older →</a>{{ else }}<span></span>{{ end }}
</nav>
{{ end }}
