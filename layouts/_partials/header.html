<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }} home">
      <img class="brand-logo light" src="{{ "images/brand/logo.png" | relURL }}" alt="" width="44" height="38">
      <img class="brand-logo dark" src="{{ "images/brand/logo-dark.png" | relURL }}" alt="" width="44" height="38">
      <span>{{ site.Title }}</span>
    </a>
    <nav class="nav" aria-label="Main">
      {{ $current := . }}
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if $current.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
