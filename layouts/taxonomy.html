{{ define "main" }}
<header class="page-head">
  <h1>{{ cond (eq .Data.Plural "tags") "태그" "카테고리" }}</h1>
</header>
<ul class="terms">
  {{ range .Data.Terms.ByCount }}
    <li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }} <span class="count">{{ .Count }}</span></a></li>
  {{ else }}
    <li class="empty">아직 없습니다.</li>
  {{ end }}
</ul>
{{ end }}
