{{ define "main" }}
<header class="page-head">
  <h1>{{ .Title }}</h1>
  <p class="muted">총 {{ len .RegularPages }}편</p>
</header>

<section class="list">
  {{ $pager := .Paginate .RegularPages.ByDate.Reverse }}
  {{ range $pager.Pages }}
    {{ partial "post-card.html" . }}
  {{ else }}
    <p class="empty">아직 글이 없습니다.</p>
  {{ end }}
</section>

{{ partial "pagination.html" $pager }}
{{ end }}
